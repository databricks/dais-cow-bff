name: Cow BFF (sync Git Folder)

concurrency: prod_environment 

on:
  push:
    branches:
      # Set your base branch name here
      - cicd-doc-revamp

jobs:
  deploy:
    name: "Update git folder "
    environment: Lighthouse
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      # DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      # DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      # DATABRICKS_TOKEN_AUDIENCE: https://databricks.com               # Optional. Must match the audience set in the policy.



    steps:
      - uses: actions/checkout@v3
      - uses: databricks/setup-cli@main
      - name: Update git folder
        run: databricks repos update 4283197629343453 --branch cicd-doc-revamp
